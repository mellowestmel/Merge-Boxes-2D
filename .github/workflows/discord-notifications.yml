
name: Discord Notifications

on:
  push:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          API_URL: ${{ github.api_url }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          def github_get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "GitHub-Discord-Notifications/1.0"
                  }
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          event_path = os.environ.get("GITHUB_EVENT_PATH")

          if not event_path or not os.path.isfile(event_path):
              print("GitHub event file not found.")
              raise SystemExit(1)

          with open(event_path, encoding="utf-8") as f:
              event = json.load(f)

          repo = os.environ["REPO"]
          event_type = os.environ["EVENT"]
          color = 0x6E99CA

          if event_type == "push":
              commit = event.get("head_commit")

              if not commit:
                  print("No commit details found.")
                  raise SystemExit(0)

              sha = commit["id"]
              details = github_get(
                  f"{os.environ['API_URL']}/repos/{repo}/commits/{sha}"
              )

              message = commit.get("message", "Repository updated")
              subject, _, body = message.partition("\n\n")
              author = (
                  (commit.get("author") or {}).get("name")
                  or "Unknown"
              )

              title = f"New Commit: {subject}"[:256]

              description = (
                  body.strip()[:3000]
                  or f"{author} pushed an update to `{os.environ['BRANCH']}`."
              )

              stats = details.get("stats", {})
              files = details.get("files", [])

              fields = [
                  {
                      "name": "Branch",
                      "value": f"`{os.environ['BRANCH']}`",
                      "inline": True
                  },
                  {
                      "name": "Author",
                      "value": f"`{author[:1024]}`",
                      "inline": True
                  },
                  {
                      "name": "Changes",
                      "value": (
                          "```diff\n"
                          f"+ {stats.get('additions', 0)} additions\n"
                          f"- {stats.get('deletions', 0)} deletions\n"
                          f"  {len(files)} files changed\n"
                          "```"
                      ),
                      "inline": False
                  }
              ]

              if files:
                  lines = [
                      f"  {file.get('status', 'modified')}: "
                      f"{file['filename']}"
                      for file in files[:10]
                  ]

                  if len(files) > 10:
                      lines.append(f"  ...and {len(files) - 10} more")

                  fields.append({
                      "name": "Files changed",
                      "value": "```\n" + "\n".join(lines) + "\n```",
                      "inline": False
                  })

              fields.append({
                  "name": "Commit",
                  "value": f"[`{sha[:7]}`](https://github.com/{repo}/commit/{sha})",
                  "inline": True
              })

              url = None

          elif event_type == "release":
              release = event.get("release", {})
              title = (
                  release.get("name")
                  or release.get("tag_name")
                  or "New release"
              )

              description = (
                  release.get("body") or "A new release is available."
              )[:4000]

              fields = [
                  {
                      "name": "Version",
                      "value": release.get("tag_name", "Unknown"),
                      "inline": True
                  },
                  {
                      "name": "Published by",
                      "value": (release.get("author") or {}).get(
                          "login", "Unknown"
                      ),
                      "inline": True
                  }
              ]

              url = release.get("html_url")

          else:
              print("Unsupported event:", event_type)
              raise SystemExit(0)

          embed = {
              "title": title,
              "description": description,
              "color": color,
              "fields": fields
          }

          if url:
              embed["url"] = url

          payload = {
              "embeds": [embed],
              "allowed_mentions": {"parse": []}
          }

          webhook = os.environ.get("WEBHOOK", "").strip()

          if not webhook:
              print("Error: DISCORD_WEBHOOK_URL secret is empty.")
              raise SystemExit(1)

          request = urllib.request.Request(
              webhook + "?wait=true",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com, 1.0)"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Discord notification sent:", response.status)

          except urllib.error.HTTPError as error:
              print("Discord HTTP status:", error.code)
              print(
                  "Discord response:",
                  error.read().decode("utf-8", errors="replace")
              )
              raise

          except urllib.error.URLError as error:
              print("Could not connect to Discord:", error.reason)
              raise
          PY